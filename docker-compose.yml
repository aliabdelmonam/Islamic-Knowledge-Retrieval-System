version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hadith_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped

  api:
    build: .
    container_name: hadith_rag_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./models:/app/models     # persist BM25 + parent store
      - ./data:/app/data         # CSV data
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
